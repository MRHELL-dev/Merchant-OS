[package]
name = "desktop"
version = "0.1.0"
description = "Merchant OS Desktop Backend"
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
